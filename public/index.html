<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#123524">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Harvest">
    <title>Community Harvest</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <img src="/icons/icon.svg" alt="" width="72" height="72">
        <p>Community Harvest</p>
      </div>

    <div id="toast-region" class="toasts" aria-live="polite" aria-atomic="false"></div>

      <div class="noscript">Please enable JavaScript to use Community Harvest.</div>
